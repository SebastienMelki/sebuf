openapi: 3.1.0
info:
    title: StructTypeService API
    version: 1.0.0
paths:
    /api/v1/structs/{id}:
        get:
            tags:
                - StructTypeService
            summary: GetStructFields
            description: Get struct fields by ID
            operationId: GetStructFields
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StructFieldsMessage'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/structs:
        post:
            tags:
                - StructTypeService
            summary: UpdateStructFields
            description: Update struct fields
            operationId: UpdateStructFields
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StructFieldsMessage'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StructFieldsMessage'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/structs/repeated/{id}:
        get:
            tags:
                - StructTypeService
            summary: GetRepeatedStructs
            description: Get repeated struct fields
            operationId: GetRepeatedStructs
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RepeatedStructMessage'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/structs/maps/{id}:
        get:
            tags:
                - StructTypeService
            summary: GetMapStructs
            description: Get map struct fields
            operationId: GetMapStructs
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MapStructMessage'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/structs/direct:
        post:
            tags:
                - StructTypeService
            summary: SetDirectStruct
            description: 'Direct WKT RPC: input and output are Struct well-known types'
            operationId: SetDirectStruct
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema: {}
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        StructRequest:
            type: object
            properties:
                id:
                    type: string
            description: StructRequest is a simple request.
        StructFieldsMessage:
            type: object
            properties:
                meta:
                    type: object
                    additionalProperties: true
                    description: Arbitrary JSON object metadata
                data:
                    examples:
                        - hello
                        - 42
                    example: hello
                series:
                    type: array
                    items: {}
            description: StructFieldsMessage tests all 3 Struct well-known types as singular fields.
        RepeatedStructMessage:
            type: object
            properties:
                configs:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                items:
                    type: array
                    items: {}
                matrices:
                    type: array
                    items:
                        type: array
                        items: {}
            description: RepeatedStructMessage tests repeated Struct well-known fields.
        MapStructMessage:
            type: object
            properties:
                attributes:
                    type: object
                    additionalProperties:
                        type: object
                        additionalProperties: true
                properties:
                    type: object
                    additionalProperties: {}
            description: MapStructMessage tests map fields with Struct well-known values.
        AttributesEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    type: object
                    additionalProperties: true
        PropertiesEntry:
            type: object
            properties:
                key:
                    type: string
                value: {}
