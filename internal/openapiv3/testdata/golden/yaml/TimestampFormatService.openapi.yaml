openapi: 3.1.0
info:
    title: TimestampFormatService API
    version: 1.0.0
paths:
    /api/v1/timestamp-format:
        post:
            tags:
                - TimestampFormatService
            summary: CreateTimestampFormat
            operationId: CreateTimestampFormat
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimestampFormatTest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimestampFormatTest'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/timestamp-format/{id}:
        get:
            tags:
                - TimestampFormatService
            summary: GetTimestampFormat
            operationId: GetTimestampFormat
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimestampFormatTest'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        TimestampFormatTest:
            type: object
            properties:
                defaultTs:
                    type: string
                    format: date-time
                    description: Default (RFC3339) - no annotation
                rfc3339Ts:
                    type: string
                    format: date-time
                    description: Explicit RFC3339
                unixSecondsTs:
                    type: integer
                    format: unix-timestamp
                    description: Unix seconds - serializes as integer
                unixMillisTs:
                    type: integer
                    format: unix-timestamp-ms
                    description: Unix milliseconds - serializes as integer
                dateTs:
                    type: string
                    format: date
                    description: Date only - serializes as "2024-01-15"
            description: TimestampFormatTest demonstrates various timestamp format options.
        TimestampFormatRequest:
            type: object
            properties:
                id:
                    type: string
            description: TimestampFormatRequest is the request for TestTimestampFormat.
